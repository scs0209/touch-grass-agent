<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1000px; height: 420px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", sans-serif;
    background: #f3f1ea;
    color: #1b1b19;
    position: relative;
  }
  .mono { font-family: "SF Mono", Menlo, monospace; font-size: 13px; letter-spacing: .3px; color: #6b6a63; }
  .text { position: absolute; left: 48px; top: 46px; bottom: 40px; width: 350px; display: flex; flex-direction: column; }
  h1 { margin-top: 20px; font-size: 54px; line-height: .98; letter-spacing: -1.8px; font-weight: 800; }
  .tagline { margin-top: 20px; font-size: 18px; line-height: 1.45; color: #3a3a36; }
  .stack { margin-top: auto; }
  .shots { position: absolute; left: 430px; right: 40px; top: 62px; display: flex; gap: 14px; }
  .shot { flex: 1; }
  .shot .mono { display: block; margin-bottom: 10px; }
  .shot .mono b { color: #1b1b19; font-weight: 600; margin-right: 6px; }
  .frame {
    border: 1.5px solid #1b1b19; border-bottom: 0;
    border-radius: 12px 12px 0 0; overflow: hidden; background: #fff;
  }
  .frame img { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
  <div class="text">
    <p class="mono">touch-grass-agent</p>
    <h1>Should I<br />go out?</h1>
    <p class="tagline">A Gemma running on my own computer checks the weather, the air, and the parks nearby, and picks one walk. Then it tells you to put your phone away.</p>
    <p class="mono stack">Gemma 3 4B · Ollama · Mastra · Sentry</p>
  </div>
  <div class="shots">
    <div class="shot"><span class="mono"><b>01</b>the pick</span><div class="frame"><img src="result.png" /></div></div>
    <div class="shot"><span class="mono"><b>02</b>the route</span><div class="frame"><img src="map-full.png" /></div></div>
    <div class="shot"><span class="mono"><b>03</b>you made it</span><div class="frame"><img src="arrival.png" /></div></div>
  </div>
</body>
</html>
