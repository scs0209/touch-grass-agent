<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1000px; height: 420px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(120% 140% at 0% 0%, #dff0ff 0%, transparent 55%),
      radial-gradient(120% 140% at 100% 100%, #cfe9b8 0%, transparent 60%),
      linear-gradient(135deg, #e8f3fb 0%, #e9f2df 100%);
    color: #17301c;
    position: relative;
  }
  .text { position: absolute; left: 56px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 64px; height: 64px; flex: none; }
  h1 { font-size: 50px; line-height: 1.02; letter-spacing: -1.2px; font-weight: 800; }
  .tagline { margin-top: 22px; font-size: 23px; line-height: 1.35; color: #2a4630; font-weight: 500; }
  .tagline b { color: #2f6b3a; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 15px; font-weight: 600; color: #2f6b3a; background: rgba(255,255,255,.7); border: 1px solid rgba(47,107,58,.25); border-radius: 999px; padding: 6px 13px; }
  .phones { position: absolute; right: 30px; top: 0; bottom: 0; width: 440px; }
  .phone {
    position: absolute; width: 176px; height: 352px; border-radius: 26px; overflow: hidden;
    border: 5px solid #fff; box-shadow: 0 18px 40px rgba(23,48,28,.22), 0 2px 6px rgba(23,48,28,.12);
    background: #fff;
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .p1 { left: 0; top: 54px; transform: rotate(-6deg); }
  .p2 { left: 132px; top: 30px; z-index: 2; }
  .p3 { left: 264px; top: 54px; transform: rotate(6deg); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#2f6b3a" />
        <g fill="#fff">
          <path d="M32 53C26 41 27 25 32 10C37 25 38 41 32 53Z" />
          <path d="M29 53C24 44 18 37 9 32C21 32 28 41 29 53Z" />
          <path d="M35 53C40 44 46 37 55 32C43 32 36 41 35 53Z" />
        </g>
      </svg>
      <h1>Should I<br />go out?</h1>
    </div>
    <p class="tagline">One tap, one outdoor plan<br />from a <b>local Gemma</b>. Then put<br />your phone away.</p>
    <div class="chips">
      <span class="chip">Gemma 3 4B</span>
      <span class="chip">Ollama</span>
      <span class="chip">Mastra</span>
      <span class="chip">Sentry</span>
    </div>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="result.png" /></div>
    <div class="phone p2"><img src="arrival.png" /></div>
    <div class="phone p3"><img src="map-full.png" /></div>
  </div>
</body>
</html>
